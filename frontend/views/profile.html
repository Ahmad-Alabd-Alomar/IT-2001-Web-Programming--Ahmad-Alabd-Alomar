<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4">
      <h3 class="fw-bold mb-3">User Profile & Settings</h3>
      <form>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" value="Jane Doe">
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" value="jane.doe@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Role</label>
          <input type="text" class="form-control" value="Regular User" disabled>
        </div>
        <button type="button" class="btn btn-success">Save Profile Changes</button>
      </form>
    </div>
  </div>
</div>
