<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe & Meal Prep Tracker</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="#dashboard">
        <i class="fa-solid fa-utensils me-2"></i>MealPrep Hub
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#dashboard"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#recipes"><i class="fa-solid fa-book-open me-1"></i> My Recipes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#meal-plans"><i class="fa-solid fa-calendar-days me-1"></i> Meal Plans</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#external-api"><i class="fa-solid fa-magnifying-glass me-1"></i> Discover API</a>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#profile"><i class="fa-solid fa-user me-1"></i> Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#login"><i class="fa-solid fa-right-to-bracket me-1"></i> Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-success btn-sm ms-2 mt-1" href="#register">Register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container for Dynamic View Loading -->
  <main id="app-view" class="container py-4">
    <!-- View content will be injected here dynamically by app.js -->
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0 text-muted">&copy; 2026 Recipe & Meal Prep Tracker. Built for Web Programming Course.</p>
    </div>
  </footer>

  <!-- jQuery & Bootstrap Bundle JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SPA Router Script -->
  <script src="js/app.js"></script>
</body>
</html>
